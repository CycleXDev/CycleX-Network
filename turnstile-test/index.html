
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CycleX Turnstile Visual Test</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#070a12; color:#f4f6ff;
  }
  .card {
    width:min(560px,92vw); padding:28px; border-radius:22px;
    background:#0e1422; border:1px solid rgba(255,255,255,.12);
    box-shadow:0 24px 80px rgba(0,0,0,.45);
  }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:rgba(244,246,255,.72); line-height:1.55; }
  #status {
    margin-top:18px; padding:16px; border-radius:14px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10);
    white-space:pre-wrap; word-break:break-word;
  }
  .ok { color:#5dffb2; }
  .bad { color:#ff8a8a; }
  .muted { color:rgba(244,246,255,.64); }
  button {
    margin-top:16px; padding:11px 16px; border:0; border-radius:999px;
    cursor:pointer; font-weight:800;
  }
  #widget-wrap { margin-top:18px; min-height:70px; display:flex; align-items:center; }
</style>
</head>
<body>
  <main class="card">
    <h1>CycleX Turnstile Test</h1>
    <p>
      This page tests the real CycleX Turnstile widget and Reward Gateway.
      No wallet connection and no transaction are used.
    </p>

    <div id="worker" class="muted">Checking Reward Gateway…</div>

    <div id="widget-wrap">
      <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAEykQoSaiA4Q56VX"
        data-theme="dark"
        data-action="cyclex_eligibility"
        data-callback="cxTurnstilePassed"
        data-error-callback="cxTurnstileFailed"
        data-expired-callback="cxTurnstileExpired">
      </div>
    </div>

    <div id="status">Waiting for Turnstile…</div>
    <button type="button" onclick="location.reload()">Retry test</button>
  </main>

<script>
const API = "https://cycles.cyclex.network";
const TEST_ADDRESS = "0xda63b65825AE30532a507B0C091B0bD9F8204F7E";

function setStatus(text, cls="") {
  const el = document.getElementById("status");
  el.className = cls;
  el.textContent = text;
}

async function checkWorker() {
  const el = document.getElementById("worker");
  try {
    const r = await fetch(API + "/health", { cache:"no-store" });
    const d = await r.json();
    if (r.ok && d?.version === "v8-turnstile-hardened") {
      el.className = "ok";
      el.textContent = "✓ Reward Gateway v8 is live";
    } else {
      el.className = "bad";
      el.textContent = "✕ Unexpected Worker response";
    }
  } catch {
    el.className = "bad";
    el.textContent = "✕ Could not reach Reward Gateway";
  }
}

async function cxTurnstilePassed(token) {
  setStatus("Turnstile passed. Checking protected endpoint…", "muted");
  try {
    const r = await fetch(API + "/v1/eligibility", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        address:TEST_ADDRESS,
        turnstileToken:token
      })
    });
    const d = await r.json().catch(() => ({}));

    if (r.status === 423 && d?.error === "claims_closed") {
      setStatus(
        "✓ PASS\n\nTurnstile token was accepted by Siteverify.\n" +
        "The request reached the CycleX claims gate and was safely stopped because CLAIMS_OPEN=false.",
        "ok"
      );
      return;
    }

    setStatus(
      "✕ Unexpected response\n\nHTTP " + r.status + "\n" + JSON.stringify(d, null, 2),
      "bad"
    );
  } catch (e) {
    setStatus("✕ Request failed\n\n" + String(e?.message || e), "bad");
  }
}

function cxTurnstileFailed(code) {
  setStatus(
    "✕ TURNSTILE FAILED\n\nError code: " + String(code || "unknown") +
    "\n\nSend a screenshot of this page only — no DevTools needed.",
    "bad"
  );
}

function cxTurnstileExpired() {
  setStatus("Turnstile token expired. Press Retry test.", "bad");
}

checkWorker();
</script>
</body>
</html>
